[project]
name = "chess-corp-poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.8",
]

[dependency-groups]
backend = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]
dev = [
    "pillow>=13.0.0",
    "pygbag>=0.9.3",
    "pytest>=9.1.1",
]

[tool.uv]
default-groups = ["dev", "backend"]
