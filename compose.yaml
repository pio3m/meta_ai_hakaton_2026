name: chess-corp
services:
  game:
    build: .
    ports:
      - "127.0.0.1:${CHESS_CORP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./assets/generated:/app/assets/generated
    environment:
      ASSET_AI_MODE: ${ASSET_AI_MODE:-mock}
      ASSET_AI_ALLOW_PAID_REQUESTS: ${ASSET_AI_ALLOW_PAID_REQUESTS:-false}
      ASSET_AI_GLOBAL_LIMIT: ${ASSET_AI_GLOBAL_LIMIT:-1}
      ASSET_AI_TIMEOUT_SECONDS: ${ASSET_AI_TIMEOUT_SECONDS:-120}
      WORLD_AI_LEDGER_PATH: ${WORLD_AI_LEDGER_PATH:-}
      WORLD_AI_MODE: ${WORLD_AI_MODE:-mock}
      WORLD_AI_ALLOW_PAID_REQUESTS: ${WORLD_AI_ALLOW_PAID_REQUESTS:-false}
      WORLD_AI_SESSION_LIMIT: ${WORLD_AI_SESSION_LIMIT:-3}
      WORLD_AI_GLOBAL_LIMIT: ${WORLD_AI_GLOBAL_LIMIT:-3}
      WORLD_AI_MIN_INTERVAL_SECONDS: ${WORLD_AI_MIN_INTERVAL_SECONDS:-30}
      WORLD_AI_MAX_OUTPUT_TOKENS: ${WORLD_AI_MAX_OUTPUT_TOKENS:-1800}
      WORLD_AI_TOKEN_BUDGET: ${WORLD_AI_TOKEN_BUDGET:-50000}
      SESSION_JOBS_GLOBAL_LIMIT: ${SESSION_JOBS_GLOBAL_LIMIT:-50}
      DIRECTOR_MODE: ${DIRECTOR_MODE:-mock}
      DIRECTOR_ALLOW_PAID_REQUESTS: ${DIRECTOR_ALLOW_PAID_REQUESTS:-false}
      BUDDY_MODE: ${BUDDY_MODE:-mock}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      META_TIMEOUT_SECONDS: ${META_TIMEOUT_SECONDS:-25}
      META_ALLOW_PAID_REQUESTS: ${META_ALLOW_PAID_REQUESTS:-false}
      BUDDY_HISTORY_PAIRS: ${BUDDY_HISTORY_PAIRS:-10}
      BUDDY_MAX_SESSIONS: ${BUDDY_MAX_SESSIONS:-100}
      BUDDY_SESSION_TTL_SECONDS: ${BUDDY_SESSION_TTL_SECONDS:-3600}
